<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">
  <title>欢迎走进我们的仓库</title>
  <style>
    :root {
      --ink: #2b2b2b;
      --ink-soft: #5a564f;
      --green: #2e7d32;
      --green-deep: #276b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      background:
        radial-gradient(900px 520px at 12% 0%, #eef5ee 0%, transparent 62%),
        radial-gradient(700px 420px at 88% 100%, #f6efe6 0%, transparent 60%),
        #f7f5f1;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: rgba(46, 125, 50, 0.18);
    }

    .page {
      width: 100%;
      max-width: 640px;
      padding: 72px 48px;
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(46, 125, 50, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(48, 44, 38, 0.08);
      backdrop-filter: blur(6px);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 12px;
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      color: var(--green);
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 22px;
      font-family: "Noto Serif SC", "Songti SC", STSong, "SimSun", serif;
      font-size: clamp(28px, 4.6vw, 38px);
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #26241f;
    }

    .intro {
      margin: 0 auto 40px;
      max-width: 30em;
      font-size: 15.5px;
      line-height: 2;
      color: var(--ink-soft);
      text-wrap: balance;
    }

    button {
      padding: 14px 34px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: #fff;
      cursor: pointer;
      background: var(--green);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 10px 26px rgba(46, 125, 50, 0.24);
      transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease, opacity 0.4s ease;
    }

    button:hover:not(:disabled) {
      background: var(--green-deep);
      box-shadow: 0 14px 34px rgba(46, 125, 50, 0.3);
      transform: translateY(-2px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 2px solid var(--green-deep);
      outline-offset: 4px;
    }

    button:disabled {
      cursor: default;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .blessing {
      margin-top: 54px;
      opacity: 0;
      transform: translateY(16px);
      filter: blur(6px);
      transition:
        opacity 1.2s ease,
        transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1.2s ease;
    }

    .blessing::before {
      content: "";
      display: block;
      width: 0;
      height: 1px;
      margin: 0 auto 30px;
      background: rgba(46, 125, 50, 0.35);
      transition: width 1.2s ease 0.15s;
    }

    .blessing.is-visible {
      opacity: 1;
      transform: none;
      filter: blur(0);
    }

    .blessing.is-visible::before {
      width: 72px;
    }

    .blessing-text {
      display: block;
      font-family: "Noto Serif SC", "Songti SC", STSong, "SimSun", serif;
      font-size: clamp(19px, 3vw, 24px);
      line-height: 1.9;
      letter-spacing: 0.08em;
      color: #26241f;
    }

    @media (max-width: 520px) {
      .page {
        padding: 56px 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .blessing,
      .blessing::before,
      button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Welcome</p>

    <h1>欢迎走进我们的仓库</h1>

    <p class="intro">
      这里存放的不只是知识，更是知识与知识相遇、人与思想交谈的地方。若您愿意继续走近，请点击下方按钮，我将在此为您送上一份祝福。
    </p>

    <button id="blessButton" type="button">领取一份祝福</button>

    <div class="blessing" id="blessing" hidden>
      <span class="blessing-text">只要不失去你的崇高，整个世界都会为你敞开</span>
    </div>
  </main>

  <script>
    const blessButton = document.getElementById("blessButton");
    const blessing = document.getElementById("blessing");

    blessButton.addEventListener("click", () => {
      blessButton.disabled = true;
      blessButton.textContent = "祝福已送达";

      blessing.hidden = false;
      requestAnimationFrame(() => {
        blessing.classList.add("is-visible");
      });
    });
  </script>
</body>
</html>
